<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp - Mirip WhatsApp</title>
  <link rel="stylesheet" href="assets/css/chat.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="profile-header">
        <div class="avatar">A</div>
        <div>
          <h1>ChatApp</h1>
          <p>Online</p>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="contactSearch" placeholder="Cari kontak..." />
      </div>

      <ul id="contactList" class="contact-list"></ul>
    </aside>

    <main class="chat-panel">
      <header class="chat-header" id="chatHeader"></header>
      <section class="chat-messages" id="chatMessages"></section>
      <form class="chat-input" id="chatForm">
        <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off" required />
        <button type="submit">Kirim</button>
      </form>
    </main>
  </div>

  <script src="assets/js/chat.js"></script>
</body>
</html>
